name = "chi-cto"
main = "src/mcp.ts"
compatibility_date = "2024-12-19"

# Command for building (using esbuild)
[build]
command = "npm run build"

# KV Namespaces for state storage
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "sessions-kv-id"
preview_id = "sessions-kv-preview-id"

[[kv_namespaces]]
binding = "TASKS_KV"
id = "tasks-kv-id"
preview_id = "tasks-kv-preview-id"

# Production environment
[env.production]
route = "chi-cto.roderic-andrews.workers.dev"

[env.production.vars]
LOG_LEVEL = "info"
TOKEN_BUDGET = "200000"

# Staging environment
[env.staging]
route = "chi-cto-staging.roderic-andrews.workers.dev"

[env.staging.vars]
LOG_LEVEL = "debug"
TOKEN_BUDGET = "100000"
